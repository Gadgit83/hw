plugins {
    id 'com.android.application'
}

// Build profile: full (the normal app) or test (small APK for automated phone and TV tests: its own application id,
// arm64-v8a only, reduced game data from scripts/stage-assets.sh). -Pprofile=test, or HP_PROFILE=test in the environment.
def profile = (project.findProperty('profile') ?: System.getenv('HP_PROFILE') ?: 'full').toString()
if (!(profile in ['full', 'test'])) throw new GradleException("Unknown profile '${profile}' (full or test)")
def testProfile = profile == 'test'
// ABIs to build; override with -Pabis=arm64-v8a (or "arm64-v8a,x86_64"). The test profile defaults to arm64-v8a only.
def abis = (project.findProperty('abis') ?: (testProfile ? 'arm64-v8a' : 'arm64-v8a,x86_64')).split(',').collect { it.trim() }
// Where things live. The engine is the repository this directory belongs to (../.. from the Gradle root);
// third_party/ (the SDL2 clones) and build/ (generated inputs) can be redirected with the same environment
// variables the scripts use (THIRD_PARTY, BUILD_DIR, HW_ENGINE_DIR).
def engineDir = new File(System.getenv('HW_ENGINE_DIR') ?: new File(rootDir, '../..').path).canonicalFile
// Cache of Robolectric's android-all jars, filled by scripts/fetch-robolectric.sh.
def robolectricDeps = new File(System.getenv('ROBOLECTRIC_DEPS') ?: "${System.getProperty('user.home')}/.cache/hedgeparty/robolectric")
def thirdParty = new File(System.getenv('THIRD_PARTY') ?: new File(rootDir, 'third_party').path).canonicalFile
def genDir = new File(System.getenv('BUILD_DIR') ?: new File(rootDir, 'build').path).canonicalFile
def sdlJava = new File(thirdParty, 'SDL/android-project/app/src/main/java')

// Build information for the About page and the log report: the engine and app commits this APK is built from.
// Read straight from git at configuration time (the engine and the app are one repository).
def gitOut = { File dir, String... a ->
    try {
        def p = new ProcessBuilder(['git', '-C', dir.absolutePath] + a.toList()).redirectErrorStream(true).start()
        def t = p.inputStream.text.trim()
        p.waitFor()
        return p.exitValue() == 0 ? t : ''
    } catch (Exception ignored) {
        return ''
    }
}
def engineCommit = gitOut(engineDir, 'rev-parse', '--short=9', 'HEAD') ?: 'unknown'
def engineBranch = gitOut(engineDir, 'rev-parse', '--abbrev-ref', 'HEAD') ?: 'unknown'
if (engineCommit != 'unknown' && !gitOut(engineDir, 'status', '--porcelain', '--untracked-files=no', '--', 'hedgewars', 'tools/pas2c').isEmpty()) {
    engineCommit += '+local changes'
}
def appCommit = gitOut(rootDir, 'rev-parse', '--short=9', 'HEAD') ?: 'unknown'
if (appCommit != 'unknown' && !gitOut(rootDir, 'status', '--porcelain', '--untracked-files=no', '--', '.').isEmpty()) {
    appCommit += '+local changes'
}

// Identity of the build. The defaults are those of the first releases; override them to build another flavour,
// for example  ./gradlew -PappId=org.hedgewars.hedgewars.nativeport -PappName=Hedgewars assembleDebug
// The test profile installs next to the normal app (its own id), under its own name.
def appId = (project.findProperty('appId') ?: (testProfile ? 'party.hedge.host.test' : 'party.hedge.host')).toString()
def appName = (project.findProperty('appName') ?: (testProfile ? 'Hedge Party (test)' : 'Hedge Party')).toString()
// Where the corresponding source of this build can be found (shown under Options, Advanced, About).
def sourceUrl = (project.findProperty('sourceUrl') ?: 'https://github.com/Gadgit83/hw/tree/android-master').toString()

android {
    namespace 'org.hedgewars.android'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 34
        versionCode 114
        versionName testProfile ? '0.3.0-tv10-test' : '0.3.0-tv10'
        resValue 'string', 'app_name', appName
        buildConfigField 'String', 'APP_NAME', "\"${appName}\""
        buildConfigField 'String', 'PROFILE', "\"${profile}\""
        buildConfigField 'boolean', 'TEST_BUILD', testProfile.toString()
        buildConfigField 'String', 'SOURCE_URL', "\"${sourceUrl}\""
        // Shown on the About page and in the log report: which engine and which app source this APK was built from.
        buildConfigField 'String', 'ENGINE_COMMIT', "\"${engineCommit}\""
        buildConfigField 'String', 'ENGINE_BRANCH', "\"${engineBranch}\""
        buildConfigField 'String', 'APP_COMMIT', "\"${appCommit}\""
        buildConfigField 'String', 'BUILD_ABIS', "\"${abis.join(', ')}\""
        ndk { abiFilters(*abis) }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Release',
                          '-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG',
                          '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384',
                          "-DHP_ENGINE_SRC=${engineDir}",
                          "-DHP_THIRD_PARTY=${thirdParty}",
                          "-DHP_ENGINE_C=${genDir}/engine-c",
                          "-DHP_RUST_DIR=${genDir}/rust"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main {
        // SDLActivity and friends come straight from the SDL checkout (not copied into this repo).
        java.srcDirs += sdlJava
        // Trimmed game data staged by scripts/stage-assets.sh.
        assets.srcDirs += new File(genDir, 'assets')
        // libhwengine_future.so per ABI, built by scripts/build-rust.sh.
        jniLibs.srcDirs += new File(genDir, 'rust')
    }

    androidResources {
        // Already compressed formats: store as they are so first-run extraction is fast.
        noCompress += ['ogg', 'png', 'ttf', 'wav', 'lua', 'txt', 'cfg', 'yaml', 'toml']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            // Robolectric needs the merged resources to inflate the screens.
            includeAndroidResources = true
            all {
                systemProperty 'screenshot.dir', (System.getenv('SCREENSHOT_DIR') ?: new File(genDir, 'screenshots').path)
                // The staged game data the tests link in as the "installed" data (scripts/stage-assets.sh).
                systemProperty 'screenshot.data', new File(genDir, 'assets/Data').path
                systemProperty 'screenshots', project.hasProperty('screenshots') ? 'true' : 'false'
                // Offline Robolectric: the Android 14 and 15 jars come from this folder (scripts/fetch-robolectric.sh).
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', robolectricDeps.path
                maxHeapSize = '2g'
                testLogging {
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                    showStandardStreams = true
                }
            }
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// The engine C must come from the current engine checkout. By default a stale or missing
// build/engine-c is regenerated (needs GHC); -PengineStale=fail makes the build stop instead.
def engineStale = (project.findProperty('engineStale') ?: 'regenerate')
tasks.register('checkEngineC', Exec) {
    group = 'build'
    description = 'Regenerates (or rejects) engine C that does not match the engine checkout'
    workingDir file('..')
    commandLine 'bash', 'scripts/gen-engine.sh', engineStale == 'fail' ? '--check' : '--ensure'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'checkEngineC' }

// Fail early, with a pointer, when the generated inputs are missing.
tasks.matching { it.name == 'preBuild' }.configureEach {
    doFirst {
        def missing = []
        if (!new File(thirdParty, 'SDL/android-project').exists()) missing << 'third_party (scripts/fetch-deps.sh)'
        if (!new File(genDir, 'engine-c/hwengine.c').exists()) missing << 'build/engine-c (scripts/gen-engine.sh)'
        if (!new File(genDir, 'assets/Data').exists()) missing << 'build/assets (scripts/stage-assets.sh)'
        abis.each { abi ->
            if (!new File(genDir, "rust/${abi}/libhwengine_future.so").exists()) missing << "build/rust/${abi} (scripts/build-rust.sh)"
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing generated inputs: ${missing.join(', ')}. Run project_files/Android-native/scripts/build-apk.sh, or the listed scripts first.")
        }
        // The data must be the profile this build packages: a test set in a full APK (or the reverse) is a silent mistake.
        // stage-assets.sh writes the profile it staged for into Data/.profile.
        def marker = new File(genDir, 'assets/Data/.profile')
        def staged = marker.exists() ? marker.text.trim() : null
        if (staged != profile) {
            def stagedFor = staged ? "profile '${staged}'" : 'an unknown profile (no .profile marker, staged by an older script)'
            throw new GradleException("build/assets holds game data staged for ${stagedFor}, but this build is profile '${profile}'. " +
                "Stage again for this profile: HP_PROFILE=${profile} project_files/Android-native/scripts/stage-assets.sh " +
                "(or run build-apk.sh with HP_PROFILE=${profile}).")
        }
    }
}

// Unit tests (src/test): the launch smoke test (LaunchSmokeTest, run by scripts/ui-smoke-test.sh) and, on request, pictures
// of the setup screens without a phone. Robolectric renders the real layouts. The pictures use Skia (graphics mode
// NATIVE) at 2340 x 1080 and 409 dpi, as on the Fairphone 4, and are not part of any normal run:
//   ./gradlew -Pscreenshots testDebugUnitTest --tests '*ScreenshotTest'
// and see build/screenshots/*.png.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
